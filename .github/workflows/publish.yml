name: Publish to npm

# Publishes @flexops/cli to registry.npmjs.org via npm trusted publishing
# (OIDC) — no stored token, no MFA prompt. Triggered on a vX.Y.Z tag push or
# manual workflow_dispatch. Mirrors the flexops-sdk-node publish workflow.
#
# One-time setup on npmjs.com (REQUIRED before the first successful run):
#   1. npmjs.com -> package @flexops/cli -> Settings -> Trusted Publishers
#   2. Add a GitHub Actions trusted publisher:
#        Organization or user: BillEisenman
#        Repository:           flexops-cli
#        Workflow filename:    publish.yml
#        Environment:          (leave blank)
#   Until configured, `npm publish` returns HTTP 404 (npm reports an
#   unauthorized publish as 404, not 403).
#
# Release flow: bump "version" in package.json, commit, then
#   git tag vX.Y.Z && git push origin vX.Y.Z   (or run this workflow manually)
#
# Docs: https://docs.npmjs.com/trusted-publishers

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required to mint the OIDC token GitHub -> npm exchanges

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # OIDC trusted publishing needs npm CLI 11.5+; node 20 ships an older npm.
      - name: Ensure npm supports OIDC publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke-check CLI entry resolves
        run: |
          set -e
          cat > "$RUNNER_TEMP/check-cli.mjs" <<'EOF'
          import { readFileSync, existsSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('./package.json','utf8'));
          const rel = p => p.replace(/^\.\//,'');
          const targets = new Set([pkg.main, ...Object.values(pkg.bin || {})].filter(Boolean).map(rel));
          let bad = 0;
          for (const t of targets) {
            if (!existsSync(t)) { console.error('::error::entry target missing: ' + t); bad++; continue; }
            execFileSync(process.execPath, ['--check', t]);   // syntax-valid, no execution
          }
          if (bad) process.exit(1);
          for (const b of Object.values(pkg.bin || {})) {
            const first = readFileSync(rel(b),'utf8').split('\n',1)[0];
            if (!first.startsWith('#!')) { console.error('::error::bin missing shebang: ' + b); process.exit(1); }
          }
          console.log('CLI entries OK: ' + [...targets].join(', '));
          EOF
          node "$RUNNER_TEMP/check-cli.mjs"

      - name: Publish (OIDC trusted publisher)
        run: npm publish --access public --provenance
